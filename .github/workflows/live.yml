name: live

# The hourly market pulse (routine live_pulse, config/routines.json): while the US market is open, every hour, each
# name's move today, the index funds, a VIX-tracking fear gauge and the latest market and company news, from Finnhub's
# free plan (scripts/live.py). Moves only, never a price. Published to the data branch like every other run, then the
# site is redeployed so the app shows it within minutes. Without the FINNHUB_API_KEY secret the script does nothing.
# No ops log entry per hour (eight a day would push the daily routines out of its 500-run window).
on:
  schedule:
    - cron: "7 13-21 * * 1-5"   # live_pulse: 13:07 to 21:07 UTC covers 9:30 to 16:00 New York in summer and winter
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily  # shared with the daily, why and brain runs so no two publish to the data branch at once
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore published data (data branch)
        id: restore
        run: echo "base=$(bash scripts/data_branch.sh restore)" >> "$GITHUB_OUTPUT"

      - name: Market pulse (moves and news only)
        id: live_pulse
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python3 scripts/live.py

      - name: Lint (fails closed)
        id: lint
        run: python3 scripts/lint.py --soft-why

      - name: Publish to the data branch
        id: commit
        if: always() && steps.restore.outputs.base != ''
        run: |
          if [ "${{ steps.live_pulse.outcome }}" != "success" ] || [ "${{ steps.lint.outcome }}" != "success" ]; then
            bash scripts/data_branch.sh reset "${{ steps.restore.outputs.base }}"
          fi
          git config user.name "stocks-brain-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          out=$(bash scripts/data_branch.sh publish "${{ steps.restore.outputs.base }}" "data: market pulse $(date -u +%FT%H:%MZ)" | tail -1)
          echo "data branch: $out"
          if [ "$out" = "published" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Redeploy Pages
        if: always() && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
