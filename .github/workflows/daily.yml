name: daily

# Code-only routines (config/routines.json). Lint fails if an active routine's cron is missing here.
# Every run, success or failure, is appended to data/ops/routine_runs.json and shown on the Ops tab.
# Data is published to the `data` branch (data/ and runs/ only; scripts/data_branch.sh), so main can require PRs.
on:
  schedule:
    - cron: "40 23 * * 1-5"   # fetch_prices, score_picks, regime_monitor, ..., score_people (after the US close)
    - cron: "0 13 1 * *"      # calibration
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and validate only; write and commit nothing"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  routines:
    runs-on: ubuntu-latest
    env:
      MONTHLY: ${{ github.event.schedule == '0 13 1 * *' }}
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Restore published data (data branch)
        id: restore
        run: echo "base=$(bash scripts/data_branch.sh restore)" >> "$GITHUB_OUTPUT"

      - name: Fetch prices (all-or-nothing)
        id: fetch_prices
        if: env.MONTHLY != 'true'
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python3 scripts/fetch_prices.py ${{ env.DRY == 'true' && '--dry-run' || '' }}

      - name: Derive public market numbers (no raw prices)
        id: derive_market
        if: env.MONTHLY != 'true' && env.DRY != 'true'
        run: python3 scripts/routines_code.py derive

      - name: Score matured picks
        id: score_picks
        if: env.MONTHLY != 'true' && env.DRY != 'true'
        run: python3 scripts/routines_code.py score

      - name: Regime monitor
        id: regime_monitor
        if: env.MONTHLY != 'true' && env.DRY != 'true'
        run: python3 scripts/routines_code.py regime

      - name: Goal check and portfolio rule
        id: portfolio_rule
        if: env.MONTHLY != 'true' && env.DRY != 'true'
        run: python3 scripts/routines_code.py longrun

      - name: Paper portfolio (forward only)
        id: paper_portfolio
        if: env.MONTHLY != 'true' && env.DRY != 'true'
        run: python3 scripts/routines_code.py paper

      - name: Rule backtests (derived numbers only)
        id: rule_backtests
        if: env.MONTHLY != 'true' && env.DRY != 'true'
        continue-on-error: true  # research step: a failure is logged but must not discard the day's market data
        run: python3 scripts/routines_code.py rules

      - name: Forward ledger of every rule
        id: rule_ledger
        if: env.MONTHLY != 'true' && env.DRY != 'true'
        continue-on-error: true  # research step: a failure is logged but must not discard the day's market data
        run: python3 scripts/routines_code.py ledger

      - name: Score people's public calls (derived numbers only)
        id: score_people
        if: env.MONTHLY != 'true' && env.DRY != 'true'
        continue-on-error: true  # research step: a failure is logged but must not discard the day's market data
        run: python3 scripts/routines_code.py people

      - name: Calibration
        id: calibration
        if: env.DRY != 'true' && (env.MONTHLY == 'true' || github.event_name == 'workflow_dispatch')
        run: python3 scripts/routines_code.py calibration

      - name: Lint (fails closed)
        id: lint
        run: python3 scripts/lint.py

      # Always record the run (even on failure). Only data that passed lint is committed.
      - name: Record run and publish to the data branch
        id: commit
        if: always() && env.DRY != 'true' && github.ref == 'refs/heads/main'
        env:
          ROUTINE_FETCH_PRICES: ${{ steps.fetch_prices.outcome }}
          ROUTINE_DERIVE_MARKET: ${{ steps.derive_market.outcome }}
          ROUTINE_SCORE_PICKS: ${{ steps.score_picks.outcome }}
          ROUTINE_REGIME_MONITOR: ${{ steps.regime_monitor.outcome }}
          ROUTINE_PORTFOLIO_RULE: ${{ steps.portfolio_rule.outcome }}
          ROUTINE_PAPER_PORTFOLIO: ${{ steps.paper_portfolio.outcome }}
          ROUTINE_RULE_BACKTESTS: ${{ steps.rule_backtests.outcome }}
          ROUTINE_RULE_LEDGER: ${{ steps.rule_ledger.outcome }}
          ROUTINE_SCORE_PEOPLE: ${{ steps.score_people.outcome }}
          ROUTINE_CALIBRATION: ${{ steps.calibration.outcome }}
          ROUTINE_LINT: ${{ steps.lint.outcome }}
        run: |
          if [ "${{ steps.lint.outcome }}" != "success" ]; then bash scripts/data_branch.sh reset "${{ steps.restore.outputs.base }}"; fi
          python3 scripts/ops_log.py --workflow daily --trigger "${{ github.event_name }}" \
            --started "${{ steps.start.outputs.at }}" --run-id "${{ github.run_id }}" \
            --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git config user.name "stocks-brain-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          out=$(bash scripts/data_branch.sh publish "${{ steps.restore.outputs.base }}" "data: daily routines $(date -u +%F)" | tail -1)
          echo "data branch: $out"
          if [ "$out" = "published" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Redeploy Pages
        if: always() && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
