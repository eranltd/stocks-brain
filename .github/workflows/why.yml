name: why

# Records the why-it-moved notes of one market day (routine why_notes). A separate scheduled Claude Code session (never
# the brain) follows prompts/why_routine.md at 06:47 and 09:47 UTC Tue-Sat: it lists the day's unusual moves with
# scripts/why_candidates.py, runs the saved workflow .claude/workflows/why.js (allow-listed sources only,
# config/news_sources.json) and dispatches this workflow with the notes. It can be dispatched by hand the same way.
# The Action restores the data branch, re-checks the notes (scripts/record_why.py: schema, allow-list, dates, lengths,
# banned words, keys that our own code flags for that day, one set per market day), fills each note's move and symbols
# from our data, merges them into data/market/why.json (thirty days kept), lints and publishes to the data branch.
# Nothing is written if any check fails. The notes never enter the brain's pack.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Notes JSON: {"market_date": "YYYY-MM-DD", "notes": [{"key", "kind", "market", "headline", "why", "confidence", "sources": [{"url", "publisher", "published"}]}]}'
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: daily  # shared with the daily and brain runs so no two publish to the data branch at once
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Restore published data (data branch)
        id: restore
        run: echo "base=$(bash scripts/data_branch.sh restore)" >> "$GITHUB_OUTPUT"

      - name: Validate and record the notes (fails closed)
        id: why_notes
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          mkdir -p .cache
          printf '%s' "$NOTES" > .cache/why_notes.json
          python3 scripts/record_why.py .cache/why_notes.json

      - name: Lint (fails closed)
        id: lint
        run: python3 scripts/lint.py

      - name: Record run and publish to the data branch
        id: commit
        if: always() && steps.restore.outputs.base != ''
        env:
          ROUTINE_WHY_NOTES: ${{ steps.why_notes.outcome }}
          ROUTINE_LINT: ${{ steps.lint.outcome }}
        run: |
          if [ "${{ steps.why_notes.outcome }}" != "success" ] || [ "${{ steps.lint.outcome }}" != "success" ]; then
            bash scripts/data_branch.sh reset "${{ steps.restore.outputs.base }}"
          fi
          python3 scripts/ops_log.py --workflow why --trigger "${{ github.event_name }}" \
            --started "${{ steps.start.outputs.at }}" --run-id "${{ github.run_id }}" \
            --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git config user.name "stocks-brain-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          out=$(bash scripts/data_branch.sh publish "${{ steps.restore.outputs.base }}" "data: why notes $(date -u +%F)" | tail -1)
          echo "data branch: $out"
          if [ "$out" = "published" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Redeploy Pages
        if: always() && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
