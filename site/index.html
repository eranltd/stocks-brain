<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="A personal, public stock-analysis notebook. Analysis only, not financial advice.">
  <title>stocks·brain</title>
  <meta name="theme-color" content="#0a0b0c">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./manifest.webmanifest">
  <!-- iPhone home-screen (PWA) -->
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="stocks·brain">
  <meta name="format-detection" content="telephone=no">
  <script>
    try { var t = localStorage.getItem("sb-theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
    // Language before the first paint (the same rule as detectLang in src/lib/i18n.js): a choice made with the switch,
    // else the device's first language. English stays the default; LangProvider keeps <html lang dir> in step after.
    (function () {
      var l = null;
      try { l = localStorage.getItem("sb:lang"); } catch (_) {}
      if (l !== "he" && l !== "en") {
        try { l = /^(he|iw)(-|_|$)/i.test((navigator.languages && navigator.languages[0]) || navigator.language || "") ? "he" : "en"; } catch (_) { l = "en"; }
      }
      if (l === "he") { document.documentElement.lang = "he"; document.documentElement.dir = "rtl"; }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>This dashboard needs JavaScript. The raw data is in the repository under runs/ and data/.</noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
